name: Deploy Web to GitHub Pages

# This is the only workflow allowed to publish the Pages site.
# The APK itself lives in GitHub Releases (binary distribution); Pages only links to it.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Export web build
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1
          EXPO_PUBLIC_API_URL: https://medical-sbit.onrender.com/api/v1
          EXPO_PUBLIC_WS_URL: wss://medical-sbit.onrender.com/api/v1/chat/ws
        run: npx expo export --platform web --output-dir dist

      - name: SPA fallback & prevent Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
