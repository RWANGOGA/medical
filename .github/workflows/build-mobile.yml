name: Build iOS (EAS, manual)

# iOS still needs Apple signing, so it stays on EAS and runs only on demand.
# Android is built locally in CI by build-apk.yml and no longer depends on EAS.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build-ios:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build iOS IPA
        run: eas build --platform ios --profile preview --non-interactive --no-wait
